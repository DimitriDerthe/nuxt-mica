<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="mica. Native calm, for every Nuxt app. A Nuxt 4 UI layer.">
  <defs>
    <radialGradient id="g1" cx="1040" cy="200" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0071E3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="140" cy="520" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BF4800" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#BF4800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#5AB0FF"/>
      <stop offset=".55" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#003E99"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#000000" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="480" fill="url(#fade)"/></mask>
    <linearGradient id="area" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0071E3" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0071E3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1280" height="480" fill="#F5F5F7"/>
  <rect width="1280" height="480" fill="url(#dots)" mask="url(#gridMask)"/>
  <rect width="1280" height="480" fill="url(#g1)"/>
  <rect width="1280" height="480" fill="url(#g2)"/>

  <!-- the brand dot, oversized -->
  <circle cx="1190" cy="440" r="140" fill="url(#orb)"/>

  <!-- copy -->
  <g transform="translate(80 78) scale(.62)">
    <g fill="none" stroke="#1D1D1F" stroke-width="11">
      <path d="M5.5 60V28a13 12.5 0 0 1 26 0V60M31.5 28a13 12.5 0 0 1 26 0V60"/>
      <path d="M75.5 10V60"/>
      <path d="M126.79 21.21A19.5 19.5 0 1 0 126.79 48.79"/>
      <circle cx="165" cy="35" r="19.5"/>
      <path d="M184.5 10V60"/>
    </g>
    <circle cx="75.5" cy="-1.5" r="6.5" fill="#1D1D1F"/>
    <circle cx="207" cy="49" r="11" fill="#0071E3"/>
  </g>
  <text x="80" y="188" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-2" fill="#1D1D1F">Native calm,</text>
  <text x="80" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-2" fill="#0071E3">for every Nuxt app.</text>
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#515154">134 SSR-safe components · 302 blocks · light &amp; dark · 60 fps</text>

  <g transform="translate(80 336)">
    <rect width="500" height="56" rx="14" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="499" height="55" rx="13.5" fill="none" stroke="#000000" stroke-opacity="0.09"/>
    <text x="22" y="35" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#1D1D1F"><tspan fill="#BF4800">extends</tspan>: [<tspan fill="#0066CC">'github:DimitriDerthe/nuxt-mica'</tspan>]</text>
  </g>
  <text x="80" y="428" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#86868B">NUXT 4 LAYER  ·  ZERO RUNTIME DEPENDENCIES  ·  AI-READY DOCS</text>

  <!-- live-looking sample stage -->
  
  <g transform="translate(700 60) rotate(-1.5)" filter="url(#shadow)">
    <rect width="300" height="150" rx="18" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="299" height="149" rx="17.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
    
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#515154">Monthly revenue</text>
    <text x="24" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#1D1D1F">€48.2k</text>
    <rect x="186" y="20" width="90" height="26" rx="13" fill="#248A3D" fill-opacity=".14"/>
    <text x="231" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#248A3D">+12.4%</text>
    <polygon points="24,118 24,118 46,104 68,110 90,96 112,100 134,88 156,92 178,78 200,84 222,70 244,74 266,60 266,118" fill="url(#area)" transform="translate(0 14)"/>
    <polyline points="24,118 46,104 68,110 90,96 112,100 134,88 156,92 178,78 200,84 222,70 244,74 266,60" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 14)"/>
  </g>

  
  <g transform="translate(1028 64) rotate(1.5)" filter="url(#shadow)">
    <rect width="190" height="176" rx="18" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="189" height="175" rx="17.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
    
    <text x="22" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#515154">Weekly users</text>
    <rect x="20" y="102.80000000000001" width="14" height="53.199999999999996" rx="5" fill="#0071E3" fill-opacity="0.32"/><rect x="42" y="83.2" width="14" height="72.8" rx="5" fill="#0071E3" fill-opacity="0.32"/><rect x="64" y="114" width="14" height="42" rx="5" fill="#0071E3" fill-opacity="0.32"/><rect x="86" y="66.4" width="14" height="89.6" rx="5" fill="#0071E3" fill-opacity="0.32"/><rect x="108" y="91.60000000000001" width="14" height="64.39999999999999" rx="5" fill="#0071E3" fill-opacity="0.32"/><rect x="130" y="55.2" width="14" height="100.8" rx="5" fill="#0071E3" fill-opacity="1"/><rect x="152" y="74.80000000000001" width="14" height="81.19999999999999" rx="5" fill="#0071E3" fill-opacity="0.32"/>
  </g>

  
  <g transform="translate(704 238) rotate(0)" filter="url(#shadow)">
    <rect width="296" height="136" rx="18" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="295" height="135" rx="17.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
    
    <text x="22" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1D1F">Settings</text>
    <text x="22" y="72" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1D1D1F">Cloud sync</text>
    <rect x="224" y="54" width="44" height="26" rx="13" fill="#0071E3"/>
    <circle cx="255" cy="67" r="11" fill="#FFFFFF"/>
    <rect x="22" y="90" width="246" height="1" fill="#000000" fill-opacity="0.09"/>
    <text x="22" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1D1D1F">Release alerts</text>
    <rect x="224" y="100" width="44" height="26" rx="13" fill="#E8E8ED"/>
    <circle cx="237" cy="113" r="11" fill="#FFFFFF"/>
  </g>

  
  <g transform="translate(700 398) rotate(0)" filter="url(#shadow)">
    <rect width="330" height="60" rx="18" fill="#FFFFFF"/>
    <rect x=".5" y=".5" width="329" height="59" rx="17.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
    
    <rect x="12" y="12" width="36" height="36" rx="10" fill="#0071E3"/>
    <circle cx="36" cy="36" r="5" fill="#FFFFFF"/>
    <text x="62" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">Deploy finished</text>
    <text x="62" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#515154">mica-site is live on 3 regions in 41 s.</text>
    <text x="312" y="27" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#86868B">now</text>
  </g>
  </g>
</svg>
