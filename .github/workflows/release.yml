name: Release

# Every merge to main gets a version: scripts/release.mjs picks patch, minor or major from the
# Conventional Commits since the last tag (rules in scripts/bump-level.mjs and the README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time and never cancel each other: a cancelled run could leave a pushed tag without its release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The bump commit is pushed with GITHUB_TOKEN, which never triggers workflows; this guard covers manual pushes of one.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the bump commit and the tag, create the GitHub release
      actions: write  # dispatch the Pages workflow so the site shows the new version
    steps:
      # Third-party actions are pinned to commit SHAs; the comment gives the tag they resolve to.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # tags and history since the last release
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Never tag a main that fails its own checks.
      - name: Check generated docs and tests
        run: |
          pnpm docs:check
          pnpm test
      - name: Bump, commit, tag and push
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs auto --notes "$RUNNER_TEMP/notes.md" --push
      - name: Create the GitHub release
        if: steps.bump.outputs.released == 'true'
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
      # The bump commit does not trigger the Pages workflow (GITHUB_TOKEN push), so redeploy the site from it.
      - name: Redeploy the site
        if: steps.bump.outputs.released == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
